<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberLens — Login</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-grid"></div>
    <div class="glow-orb glow-1"></div>
    <div class="glow-orb glow-2"></div>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <h1>⬡ Cyber<span>Lens</span></h1>
                <p>Cyber Threat Intelligence Portal</p>
            </div>

            <div class="auth-title">Sign In to Continue</div>
            <div class="auth-error" id="errorMsg"></div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter your username" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>

            <button class="auth-btn" onclick="doLogin()">Login →</button>

            <div class="auth-switch">
                Don't have access? <a href="/signup">Sign Up</a>
            </div>
        </div>
    </div>

    <script>
        async function doLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMsg');
            errorEl.style.display = 'none';

            if (!username || !password) {
                errorEl.textContent = 'Please fill in all fields';
                errorEl.style.display = 'block';
                return;
            }

            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                window.location.href = '/';
            } else {
                errorEl.textContent = data.error;
                errorEl.style.display = 'block';
            }
        }

        document.addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
    </script>
</body>
</html>
