<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberLens — Sign Up</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-grid"></div>
    <div class="glow-orb glow-1"></div>
    <div class="glow-orb glow-2"></div>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <h1>⬡ Cyber<span>Lens</span></h1>
                <p>Request Access to CyberLens</p>
            </div>

            <div class="auth-title">Create Account</div>
            <div class="auth-error" id="errorMsg"></div>
            <div class="auth-success" id="successMsg"></div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Choose a username" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create a password">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm" placeholder="Re-enter your password">
            </div>
            <div class="form-group">
                <label>CyberLens Code</label>
                <input type="password" id="code" placeholder="Enter the secret access code">
                <div class="code-hint">* Contact the admin to get this code</div>
            </div>

            <button class="auth-btn" onclick="doSignup()">Create Account →</button>

            <div class="auth-switch">
                Already have access? <a href="/login">Login</a>
            </div>
        </div>
    </div>

    <script>
        async function doSignup() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            const code = document.getElementById('code').value;
            const errorEl = document.getElementById('errorMsg');
            const successEl = document.getElementById('successMsg');
            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            if (!username || !password || !confirm || !code) {
                errorEl.textContent = 'Please fill in all fields';
                errorEl.style.display = 'block';
                return;
            }

            const res = await fetch('/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, confirm, code })
            });
            const data = await res.json();
            if (data.success) {
                successEl.textContent = 'Account created! Redirecting to login...';
                successEl.style.display = 'block';
                setTimeout(() => window.location.href = '/login', 1500);
            } else {
                errorEl.textContent = data.error;
                errorEl.style.display = 'block';
            }
        }
    </script>
</body>
</html>
